[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dahlia"
version = "0.1.0"
description = "DAHLIA: Desktop-first application for human-in-the-loop imputation experiments."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest"
]