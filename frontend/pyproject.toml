[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dahlia"
version = "1.1.0"
description = "DAHLIA: desktop application for human-in-the-loop imputation experiments."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "plotly>=6.0,<7.0",
    "umap-learn>=0.5.7,<0.6",
    "nicegui>=3.10,<4.0",
    "pywebview>=5.4,<7.0",
    "httpx>=0.27,<1.0",
    "keyring>=24.0,<26.0",
    "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]
build = [
    "pyinstaller-hooks-contrib>=2025.10",
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
dahlia-app = "dahlia.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
