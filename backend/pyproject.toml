[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dahlia-backend"
version = "0.1.0"
description = "DAHLIA: REST API backend for authentication, RBAC and experiment synchronisation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",
    "pydantic-settings>=2.0,<3.0",
    "pyjwt>=2.8,<3.0",
    "pwdlib[bcrypt]>=0.2,<1.0",
    "alembic>=1.13,<2.0",
    "email-validator>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",  # AsyncClient for FastAPI TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
