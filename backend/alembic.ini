# Alembic configuration file for DAHLIA backend.
# NOTE: `sqlalchemy.url` is intentionally left empty here.
# The database URL is injected dynamically from app.core.config in env.py.

[alembic]
script_location = alembic

# Template used to generate new migration file names.
# %(rev)s  — short revision hash
# %(slug)s — sanitised version of the -m message
file_template = %%(rev)s_%%(slug)s

# Maximum length of the %(slug)s component in generated file names.
truncate_slug_length = 40

# Leave empty — URL is set programmatically in env.py.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
